# The settings live in .env (copy .env.example to start): Compose reads it for
# the build argument below and hands it to the container. Without a .env the
# server runs with its defaults.
services:
  yoshida:
    build:
      context: .
      args:
        # dev stamps the build as a preview (a red DEV beside the version).
        YOSHIDA_CHANNEL: ${YOSHIDA_CHANNEL:-}
    container_name: yoshida
    image: yoshida:latest
    ports:
      - "${YOSHIDA_PUBLISH_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      # The usage counts. A named volume survives `docker compose down` and a
      # rebuild; `docker compose down -v` deletes it.
      - yoshida-data:/data
    restart: unless-stopped

volumes:
  yoshida-data:
