[package]
name = "yoshida-desktop"
# The app's version is in tauri.conf.json (read from web/package.json).
version = "0.0.0"
edition = "2021"
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
percent-encoding = "2"

[profile.release]
strip = true
lto = true
