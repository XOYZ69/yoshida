# Checks and tests: the Zig core and CLI, every release target, and the web
# editor (types, build, end-to-end test in Chromium).
name: CI

on:
  pull_request:
  workflow_dispatch:
  # The deploy workflow runs these checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that only touches docs, the website content or repo
  # metadata does not need the five-target build or the browser tests. The
  # core job still runs (it checks the version copies in the docs). Skipped
  # jobs count as passed for required checks. Pushes and manual runs always
  # run everything.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - name: Does the pull request touch code?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          other='^(site/|[^/]+\.md$|LICENSE$|\.github/(ISSUE_TEMPLATE/|release-intro/|scripts/release-notes\.mjs$|CODEOWNERS$|dependabot\.yml$|labeler\.yml$|pull_request_template\.md$|release\.yml$|workflows/(pr-title|labeler|release-notes-preview)\.yml$))'
          if printf '%s\n' "$files" | grep -qvE "$other"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs and repo metadata changed: skipping the target builds and browser tests"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: Core and CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig

      # build.zig.zon holds the version; the copies in web/ and the docs
      # must match it.
      - name: Version copies in sync
        run: node scripts/version.mjs check

      - name: Zig formatting
        run: zig fmt --check build.zig src

      - name: Unit tests
        run: zig build test

      - name: Build
        run: zig build

      - name: Example files are canonically formatted
        run: ./zig-out/bin/yoshida fmt --check examples

      - name: Examples check without errors
        run: |
          for e in examples/*/; do
            echo "::group::yoshida check $e"
            ./zig-out/bin/yoshida check "$e"
            echo "::endgroup::"
          done

      # Examples that load images from the web are skipped, so a remote
      # site cannot break the build.
      - name: Examples render
        run: |
          for e in examples/*/; do
            if grep -rqE 'https?://' "$e"designs "$e"cards 2>/dev/null; then
              echo "skipping $e (uses web images)"
              continue
            fi
            ./zig-out/bin/yoshida render "$e" --offline --out "out/$(basename "$e")"
          done
          echo "$(find out -name '*.png' | wc -l) card(s) rendered"

  targets:
    name: Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos, aarch64-macos, x86_64-windows-gnu]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dstrip=true

  web:
    name: Web editor
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-zig
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the WASM core and copy the examples
        run: |
          npm run wasm
          npm run examples

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: End-to-end test
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run test:ui -- http://localhost:4173/

      - name: Keep screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results
          path: web/test-results/
          retention-days: 7

  site:
    name: Website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Zola
        run: |
          mkdir -p "$RUNNER_TEMP/zola"
          curl -sSL "https://github.com/getzola/zola/releases/download/v0.23.6/zola-v0.23.6-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$RUNNER_TEMP/zola"
          echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"

      # Fails on any broken internal link or anchor in the docs.
      - name: Build
        working-directory: site
        run: zola build --output-dir ../public
