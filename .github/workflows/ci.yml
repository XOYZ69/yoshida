# Checks and tests: the Zig core and CLI, every release target, and the web
# editor (types, build, end-to-end test in Chromium).
#
# A pull request to dev builds only the Linux target; one to master (and every
# push, manual run and release) builds all five. The browser tests run in
# three parallel groups. "CI passed" is the one job to require in the branch
# protection: it fails when anything above it failed.
name: CI

on:
  pull_request:
  workflow_dispatch:
  # The deploy workflow runs these checks before it publishes.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request that only touches docs, the website content or repo
  # metadata does not need the five-target build or the browser tests. The
  # core job still runs (it checks the version copies and the generated
  # reference). Skipped jobs count as passed for required checks. Pushes and
  # manual runs always run everything.
  changes:
    name: Changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
      full: ${{ steps.diff.outputs.full }}
    steps:
      - name: Does the pull request touch code?
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR: ${{ github.event.pull_request.number }}
          BASE: ${{ github.base_ref }}
        run: |
          # All five targets for everything except a pull request to dev.
          if [ "$EVENT" = "pull_request" ] && [ "$BASE" != "master" ]; then
            echo "full=false" >> "$GITHUB_OUTPUT"
          else
            echo "full=true" >> "$GITHUB_OUTPUT"
          fi
          if [ "$EVENT" != "pull_request" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[].filename')
          other='^(site/|[^/]+\.md$|llms(-full)?\.txt$|LICENSE$|\.github/(ISSUE_TEMPLATE/|release-intro/|scripts/(release-notes|bump)\.mjs$|scripts/bump\.test\.mjs$|CODEOWNERS$|dependabot\.yml$|labeler\.yml$|pull_request_template\.md$|release\.yml$|workflows/(pr-title|labeler|release-notes-preview|version-bot)\.yml$))'
          if printf '%s\n' "$files" | grep -qvE "$other"; then
            echo "code=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only docs and repo metadata changed: skipping the target builds and browser tests"
            echo "code=false" >> "$GITHUB_OUTPUT"
          fi

  core:
    name: Core and CLI
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      # The scripts below need Node 22 (llms.mjs reads a TypeScript file).
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # build.zig.zon holds the version; the copies in web/ and the docs
      # must match it.
      - name: Version copies in sync
        run: node scripts/version.mjs check

      # llms.txt and llms-full.txt are generated from the schemas, the
      # function catalog, the CLI help and the docs.
      - name: Reference for AI agents is up to date
        run: node scripts/llms.mjs check

      # The collector behind the website's Stats page (stats.yml).
      - name: Stats script tests
        run: node --test scripts/stats.test.mjs

      # The version bot's rules (.github/scripts/bump.mjs).
      - name: Version bot tests
        run: node --test .github/scripts/bump.test.mjs

      - name: Zig formatting
        run: zig fmt --check build.zig src

      - name: Unit tests
        run: zig build test

      # ReleaseSafe keeps the safety checks of a debug build and renders the
      # examples about ten times faster.
      - name: Build
        run: zig build -Doptimize=ReleaseSafe

      # Every barcode format is rendered to PNG, SVG and a vector PDF and read
      # back with ZXing, so a code that looks right but does not scan fails.
      - name: Barcodes decode (ZXing round trip)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils librsvg2-bin
          python3 -m venv "$RUNNER_TEMP/zx"
          "$RUNNER_TEMP/zx/bin/pip" install --quiet zxing-cpp==3.1.1 pillow
          "$RUNNER_TEMP/zx/bin/python" scripts/barcode-roundtrip.py
          "$RUNNER_TEMP/zx/bin/python" scripts/barcode-roundtrip.py --sweep datamatrix,aztec,pdf417

      - name: Example files are canonically formatted
        run: ./zig-out/bin/yoshida fmt --check examples

      - name: Examples check without errors
        run: |
          for e in examples/*/; do
            echo "::group::yoshida check $e"
            ./zig-out/bin/yoshida check "$e"
            echo "::endgroup::"
          done

      # Examples that load images from the web are skipped, so a remote
      # site cannot break the build. Other links (a QR code's text) are fine.
      - name: Examples render
        run: |
          for e in examples/*/; do
            if grep -rqiE 'https?://[^"]*\.(png|jpe?g|webp|gif|bmp|svg)"' "$e"designs "$e"cards 2>/dev/null; then
              echo "skipping $e (uses web images)"
              continue
            fi
            ./zig-out/bin/yoshida render "$e" --offline --out "out/$(basename "$e")"
          done
          echo "$(find out -name '*.png' | wc -l) card(s) rendered"

  targets:
    name: Build ${{ matrix.target }}
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-linux-musl, aarch64-linux-musl, x86_64-macos, aarch64-macos, x86_64-windows-gnu]
    steps:
      # The five jobs always exist (a required check cannot go missing), but
      # on a pull request to dev only the Linux target does any work: the
      # others are checked on the pull request to master and by the release.
      - name: Build this target?
        id: run
        env:
          FULL: ${{ needs.changes.outputs.full }}
          TARGET: ${{ matrix.target }}
        run: |
          if [ "$FULL" = true ] || [ "$TARGET" = x86_64-linux-musl ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipped on a pull request to dev; the pull request to master builds all five targets"
          fi
      - uses: actions/checkout@v7
        if: steps.run.outputs.build
      # One cache per target: the five jobs share a job id.
      - uses: ./.github/actions/setup-zig
        if: steps.run.outputs.build
        with:
          cache-key: ${{ matrix.target }}
      - if: steps.run.outputs.build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseFast -Dstrip=true

  # Types, unit tests and the production build. The browser tests are the
  # slow part and run in parallel groups in the next job.
  web:
    name: Web editor
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the WASM core and copy the examples
        run: |
          npm run wasm
          npm run examples

      - name: Type check
        run: npm run check

      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npm run build

  # tests/ui*.mjs, split into three groups by file size (tests/run-ui.mjs).
  # Every group builds the editor itself, which takes well under a minute.
  e2e:
    name: End-to-end ${{ matrix.shard }}/3
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zig
        with:
          cache-key: e2e
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci

      - name: Build the WASM core, copy the examples and build the editor
        run: |
          npm run wasm
          npm run examples
          npm run build

      # The browser download is cached by Playwright version; the system
      # libraries it needs are installed either way.
      - name: Playwright version
        id: playwright
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        id: chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium for Playwright
        if: steps.chromium.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Chromium's system libraries
        if: steps.chromium.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: End-to-end test
        run: |
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do curl -sf http://localhost:4173/ > /dev/null && break; sleep 1; done
          npm run test:ui -- http://localhost:4173/ --shard ${{ matrix.shard }}/3

      - name: Keep screenshots of a failed run
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-results-${{ matrix.shard }}
          path: web/test-results/
          retention-days: 7

  site:
    name: Website
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-zola

      # Fails on any broken internal link or anchor in the docs.
      - name: Build
        working-directory: site
        run: zola build --output-dir ../public

  # The one check to require in the branch protection. Jobs that were skipped
  # on purpose (a docs-only change) count as passed; failed or cancelled ones
  # do not.
  ci-passed:
    name: CI passed
    if: ${{ always() }}
    needs: [changes, core, targets, web, e2e, site]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Everything passed or was skipped
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) echo "::error::a job failed or was cancelled"; exit 1 ;;
          esac
