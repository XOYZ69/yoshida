# The one workflow behind every merge: checks, the GitHub release when the
# version is new, and the site on GitHub Pages (landing page, docs and release
# notes built by Zola, with the web editor under /editor/). The dev branch is
# published next to it as a preview under /dev/, stamped DEV.
#
#   push to master   checks -> release (if the version has no tag) -> site
#   push to dev      preview (the pull request already ran the checks);
#                    a pre-release if the version has one (0.9.0-rc.1)
#   release event    site only, so the release pages follow GitHub Releases
#
# The release comes before the site build on purpose: the site lists the
# GitHub releases, so a release made first is on the site of the same run.
# Pages holds one site, so every run builds both branches and publishes them
# together: master at /, dev at /dev/.
#
# Releasing: bump the version (scripts/version.mjs, or the version bot on dev),
# merge to master. A release created with GITHUB_TOKEN triggers no other
# workflow, which is fine here: nothing else needs to run for it. To retry a
# failed release, run this workflow from the Actions tab on master.
#
# One-time setup for the preview: Settings -> Environments -> github-pages ->
# Deployment branches must allow `dev` as well as `master`.
name: Deploy

on:
  push:
    branches: [master, dev]
  release:
    types: [published, edited, deleted]
  workflow_dispatch:
    inputs:
      checks:
        description: Run the checks first (not needed when only the release pages changed)
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # master is the release gate: the checks run for every push to it. A push
  # to dev skips them (the pull request that was merged ran them), and so
  # does a release event, which publishes commits that were checked before.
  checks:
    if: (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch) || (github.event_name == 'workflow_dispatch' && inputs.checks)
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      base_url: ${{ steps.url.outputs.base_url }}
      site_ref: ${{ steps.refs.outputs.site_ref }}
      dev_ref: ${{ steps.refs.outputs.dev_ref }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      sha: ${{ steps.version.outputs.sha }}
      release: ${{ steps.version.outputs.release }}
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7

      # A release tag must name the version in build.zig.zon (v0.5.0 for 0.5.0).
      - name: Release tag matches the version
        if: github.event_name == 'release' && github.event.action == 'published'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node scripts/version.mjs check --tag "$TAG"

      # Is there a release to make? Only a push to master or dev, or a manual
      # run, can release; the commit is the one that was pushed. Releases up
      # to 0.4.0 were tagged without the v, so either spelling counts as
      # already released.
      - name: Find the version
        id: version
        if: github.event_name != 'release'
        env:
          BRANCH: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          version=$(node scripts/version.mjs)
          tag="v$version"
          channel=
          if [ "$BRANCH" = dev ]; then channel=dev; fi
          {
            echo "version=$version"
            echo "tag=$tag"
            echo "sha=$(git rev-parse HEAD)"
            echo "channel=$channel"
          } >> "$GITHUB_OUTPUT"
          if [ "$BRANCH" != "$DEFAULT" ] && [ "$BRANCH" != dev ]; then
            echo "$BRANCH is neither $DEFAULT nor dev: nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --tags origin "refs/tags/$tag" "refs/tags/$version" > /dev/null; then
            echo "$version is already tagged, nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ "$BRANCH" = dev ] && [ "${version#*-}" = "$version" ]; then
            echo "$version on dev has no pre-release part (such as -rc.1): it is released from master"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "$version has no tag yet, releasing $tag"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v6
        id: pages

      # https, without a trailing slash: the site follows the domain set
      # under Settings -> Pages.
      - name: Site address
        id: url
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          url="https://${BASE_URL#*://}"
          echo "base_url=${url%/}" >> "$GITHUB_OUTPUT"

      # The pushed branch is built at the pushed commit, the other one at its
      # head. Any other event builds both heads, so editing an old release
      # never publishes an old site. Without a dev branch there is no preview.
      - name: What to build
        id: refs
        env:
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.ref_name }}
          DEFAULT: ${{ github.event.repository.default_branch }}
        run: |
          site_ref=$DEFAULT
          dev_ref=
          if git ls-remote --exit-code --heads origin dev > /dev/null; then dev_ref=dev; fi
          if [ "$EVENT" = push ] && [ "$BRANCH" = "$DEFAULT" ]; then site_ref=$GITHUB_SHA; fi
          if [ "$EVENT" = push ] && [ "$BRANCH" = dev ]; then dev_ref=$GITHUB_SHA; fi
          if [ "$DEFAULT" = dev ]; then dev_ref=; fi
          echo "site_ref=$site_ref" >> "$GITHUB_OUTPUT"
          echo "dev_ref=$dev_ref" >> "$GITHUB_OUTPUT"
          echo "site: $site_ref, dev preview: ${dev_ref:-none}"

  # Tags the commit and publishes the GitHub release with the bundle (zip of
  # scripts/release.sh). A version with a pre-release part (0.6.0-rc.1) becomes
  # a pre-release and does not replace the latest release.
  release:
    name: Release ${{ needs.plan.outputs.tag }}
    needs: [checks, plan]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.release == 'true' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # create the tag and the release
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      SHA: ${{ needs.plan.outputs.sha }}
      # "dev" stamps a pre-release built from the dev branch.
      YOSHIDA_CHANNEL: ${{ needs.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - name: Version copies match the tag
        run: node scripts/version.mjs check --tag "$TAG"

      - uses: ./.github/actions/setup-zig
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: ./.github/actions/setup-zola

      - name: Install the editor's dependencies
        working-directory: web
        run: npm ci

      # release.sh ships the full examples, while the public web build leaves
      # out examples/.public-exclude. A public release must not contain
      # private fonts or images, so stop if that list names anything.
      - name: Examples may be redistributed
        run: |
          if grep -qvE '^[[:space:]]*(#|$)' examples/.public-exclude; then
            echo "::error::examples/.public-exclude lists private files; the release bundle would ship them"
            exit 1
          fi

      # One bundle for every platform, unpacked into yoshida-<version>/.
      - name: Build the release bundle
        run: |
          sh scripts/release.sh "yoshida-$VERSION"
          zip -qr "yoshida-$VERSION.zip" "yoshida-$VERSION"

      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: release-notes.md
          BASE_REF: ${{ needs.plan.outputs.channel == 'dev' && 'dev' || github.event.repository.default_branch }}
        run: node .github/scripts/release-notes.mjs release

      # The desktop installers are attached by the Desktop job a few minutes
      # after the release exists.
      - name: Mention the desktop app in the notes
        run: |
          {
            echo
            echo "### Desktop app (beta)"
            echo
            echo "Installers for Windows (\`.exe\`) and Linux (\`.AppImage\`, \`.deb\`, \`.rpm\`) are attached to this release a few minutes after it is published. The desktop app is a beta: it is tested on few machines so far. See [Desktop App](https://yoshida.xoyz.dev/docs/desktop-app/)."
          } >> release-notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          case "$VERSION" in *-*) flags+=(--prerelease --latest=false) ;; esac
          gh release create "$TAG" "yoshida-$VERSION.zip" \
            --target "$SHA" \
            --title "$VERSION" \
            --notes-file release-notes.md \
            "${flags[@]}"

  # The desktop app (beta): installers built by the Tauri CLI and attached to
  # the release made above. It runs after the release and the site does not
  # wait for it, so a failed installer build never blocks a release; run
  # Deploy again (or this job) to retry after fixing it. The sidecar is
  # yoshida-server, named for the Rust target triple as Tauri expects.
  desktop:
    name: Desktop ${{ matrix.name }}
    needs: [plan, release]
    if: ${{ !cancelled() && needs.release.result == 'success' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: write # attach the installers to the release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            # The oldest runner that has WebKitGTK 4.1: the AppImage and the
            # packages then run on older systems too.
            os: ubuntu-22.04
            zig_target: x86_64-linux-musl
            triple: x86_64-unknown-linux-gnu
            exe: ''
            bundles: appimage,deb,rpm
          - name: Windows
            os: windows-latest
            zig_target: x86_64-windows-gnu
            triple: x86_64-pc-windows-msvc
            exe: .exe
            bundles: nsis
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      TAG: ${{ needs.plan.outputs.tag }}
      YOSHIDA_CHANNEL: ${{ needs.plan.outputs.channel }}
      # The AppImage tools need FUSE, which runners do not have.
      APPIMAGE_EXTRACT_AND_RUN: 1
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.sha }}

      - uses: ./.github/actions/setup-zig
        with:
          cache-key: desktop-${{ matrix.name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install the system packages (Linux)
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libsoup-3.0-dev patchelf rpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Build the editor
        working-directory: web
        run: |
          npm ci
          npm run wasm
          npm run examples
          npm run build

      - name: Build the sidecar
        shell: bash
        run: |
          zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseFast -Dstrip=true
          mkdir -p desktop/src-tauri/binaries
          cp "zig-out/bin/yoshida-server${{ matrix.exe }}" "desktop/src-tauri/binaries/yoshida-server-${{ matrix.triple }}${{ matrix.exe }}"

      - name: Build the installers
        working-directory: desktop/src-tauri
        shell: bash
        run: npx --yes @tauri-apps/cli@2.12.6 build --bundles ${{ matrix.bundles }}

      - name: Attach the installers to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd desktop/src-tauri/target/release/bundle
          files=$(find . -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' -o -name '*-setup.exe' \))
          echo "$files"
          test -n "$files"
          # shellcheck disable=SC2086
          gh release upload "$TAG" $files --clobber --repo "$GITHUB_REPOSITORY"

  site:
    name: Site
    needs: [checks, plan, release]
    # Runs when the checks passed or were skipped, not when they failed, and
    # after the release job (which is skipped when there is nothing to release).
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.plan.outputs.site_ref }}
      base-url: ${{ needs.plan.outputs.base_url }}
      artifact: site

  preview:
    name: Dev preview
    needs: [checks, plan, release]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.dev_ref != '' && (needs.checks.result == 'success' || needs.checks.result == 'skipped') && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    uses: ./.github/workflows/site.yml
    with:
      ref: ${{ needs.plan.outputs.dev_ref }}
      base-url: ${{ needs.plan.outputs.base_url }}/dev
      channel: dev
      artifact: site-dev

  # A broken dev branch must not block the release site: a push to master
  # (or a release) publishes without the preview when the preview does not
  # build. A push to dev publishes only when the preview built.
  deploy:
    name: Deploy to GitHub Pages
    needs: [site, preview]
    if: ${{ !cancelled() && needs.site.result == 'success' && (needs.preview.result == 'success' || github.ref_name != 'dev') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: public

      - uses: actions/download-artifact@v8
        if: needs.preview.result == 'success'
        with:
          name: site-dev
          path: public/dev

      - uses: actions/upload-pages-artifact@v5
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v5
