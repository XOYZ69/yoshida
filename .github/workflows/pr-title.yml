# The title of a PR becomes its line in the release notes, so it must be a
# conventional title: type(scope): description. This checks it and keeps the
# type label (enhancement, bug, ...) in step with it.
#
# pull_request_target runs the workflow from master and gives fork PRs a token
# that can label. Never check out or run the PR's own code here; the title is
# only read as data.
name: PR title

on:
  pull_request_target:
    branches: [master]
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: write

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # No ref: pull_request_target checks out the base branch (master).
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the title and set the type label
        run: node .github/scripts/release-notes.mjs title
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
