# Sections of the release notes. Used by GitHub's "Generate release notes"
# button and by .github/scripts/release-notes.mjs (PR preview and the release
# workflow). Keep it to this simple shape: inline label lists only.
#
# The script sorts a PR by its conventional title first (feat -> enhancement,
# fix -> bug, perf -> performance, docs -> documentation, refactor/chore/ci/
# build/test/style/revert -> maintenance, "!" -> breaking-change) and by these
# labels only when the title has no type.
changelog:
  exclude:
    labels: [skip-changelog, duplicate, wontfix]
  categories:
    - title: Breaking changes
      labels: [breaking-change]
    - title: New features
      labels: [feature_wish, enhancement]
    - title: Bug fixes
      labels: [bug]
    - title: Performance
      labels: [performance]
    - title: Documentation
      labels: [documentation]
    - title: Maintenance
      labels: [maintenance]
    - title: Other changes
      labels: ['*']
