name: Set up Zola
description: Installs the Zola release binary that builds the website. site.yml installs the same version itself, because it builds other branches.

inputs:
  version:
    description: Zola version
    default: 0.23.6

runs:
  using: composite
  steps:
    - name: Install Zola ${{ inputs.version }}
      shell: bash
      env:
        ZOLA_VERSION: ${{ inputs.version }}
      run: |
        mkdir -p "$RUNNER_TEMP/zola"
        curl -fsSL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C "$RUNNER_TEMP/zola"
        echo "$RUNNER_TEMP/zola" >> "$GITHUB_PATH"
