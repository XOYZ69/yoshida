name: Feature wish
description: Something you would like yoshida to do
title: "feat: "
labels: ["enhancement"]
body:
  - type: textarea
    id: wish
    attributes:
      label: What do you want?
      description: Describe it in a sentence or two. A sketch or example file helps but is not needed.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why do you need it?
      description: The card or workflow you are trying to make.
  - type: dropdown
    id: component
    attributes:
      label: Which part is it about?
      options:
        - Web editor
        - CLI
        - Server / Docker
        - Design format / formulas
        - Not sure
